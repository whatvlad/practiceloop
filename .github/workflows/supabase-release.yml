name: Supabase release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or apply pending migrations
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATIONS_READY: ${{ vars.SUPABASE_MIGRATIONS_READY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.121.0
      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Inspect pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply pending migrations
        if: inputs.mode == 'apply' && env.MIGRATIONS_READY == 'true'
        run: supabase db push --linked --yes
      - name: Require migration approval flag
        if: inputs.mode == 'apply' && env.MIGRATIONS_READY != 'true'
        run: exit 1
