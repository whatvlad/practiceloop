name: Pages
# Temporary preview hosting for the frontend (mock data) until PL-014 moves it to Cloudflare Pages.
# Also publishes the Graphify code graph at /graph/, rebuilt from the pushed commit.
# Requires Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: npm ci --ignore-scripts
      # Project sites live under /<repo>/; base_path comes from the Pages settings.
      - run: npm run build -- --base="${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # Pages serves 404.html for unknown paths, so deep links reach the client router.
      - run: cp dist/index.html dist/404.html
      # Same Graphify release as scripts/setup-graphify.sh (v0.9.92), pinned to its commit.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "graphifyy @ git+https://github.com/Graphify-Labs/graphify.git@86c57be8204673c2a1b9849a3292a7dd3ab373d8"
      - name: Build code graph
        working-directory: .
        run: |
          graphify update .
          mkdir -p frontend/dist/graph
          cp graphify-out/graph.html frontend/dist/graph/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
