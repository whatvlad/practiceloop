name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_backend:
        description: Run the full backend test suite instead of the critical subset
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Backend and Database isolation skip draft PRs and changes outside their areas.
# Worksheet TeX is temporarily disabled until the worksheet is reworked.
# Frontend and Security always run (the frontend imports backend/app/content).
jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (manual run, new branch, force-push): run everything.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          # backend/tests/test_mistakes.py also reads frontend/src/data/types.ts.
          pattern='^(backend|scripts|deploy|supabase)/|^frontend/src/data/types\.ts$|^\.github/workflows/ci\.yml$'
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then backend=true; else backend=false; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The expanded curriculum includes bounded worker checks for 239 versions.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Build verified engine catalogue
        run: python -m app.engine.catalogue
      - run: shellcheck ../deploy/oracle/*.sh
      - run: python -m ruff check . ../scripts
      - run: python -m ruff format --check . ../scripts
      - run: python -m mypy
      # Keep new engine tests under test_engine*.py so they run in normal CI.
      - name: Run critical backend tests
        if: github.event_name != 'workflow_dispatch' || !inputs.full_backend
        run: >-
          python -m pytest --durations=10
          tests/test_account.py tests/test_auth.py tests/test_health.py
          tests/test_math_parser.py tests/test_math_worker.py
          tests/test_answer_check.py tests/test_answer_variables.py
          tests/test_preview.py tests/test_shares.py tests/test_topic_areas.py
          tests/test_worksheets.py tests/test_archive.py
          tests/test_engine*.py
      - name: Run full backend tests (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.full_backend
        run: python -m pytest --durations=10
      - name: Check hosted verification failure handling (offline)
        run: python -m unittest discover -s ../scripts -p 'test_supabase_*_unit.py'

  worksheet-tex:
    name: Worksheet TeX
    needs: changes
    # Disabled at the owner's request; revisit with the worksheet rework (#181).
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The same TeX packages deploy/oracle/bootstrap.sh installs on the VM (ADR-007).
      - name: Install TeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-base \
            texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Build verified engine catalogue
        run: python -m app.engine.catalogue
      - name: Compile every catalogue statement and answer, and the sandbox tests
        run: python -m pytest -m tex

  database:
    name: Database isolation
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # #200 covers all 45 probability cells and 124 HTTP E2E scenarios.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-ci-only
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_fixture.sql
      - name: Apply every migration in order
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/isolation.sql
      - name: Validate hosted-check SQL in disposable Postgres only
        run: |
          psql -v ON_ERROR_STOP=1 -c "insert into auth.users(id) values ('00000000-0000-0000-0000-000000000001'), ('00000000-0000-0000-0000-000000000002')"
          sed -e 's/REPLACE_WITH_USER_A_UUID/00000000-0000-0000-0000-000000000001/g' \
              -e 's/REPLACE_WITH_USER_B_UUID/00000000-0000-0000-0000-000000000002/g' \
              supabase/tests/hosted_fixture.sql | psql -v ON_ERROR_STOP=1
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/hosted_cleanup.sql
          psql -v ON_ERROR_STOP=1 -c "do \$\$ begin assert (select count(*) from public.problems) = 0; assert (select count(*) from public.attempts) = 0; assert (select count(*) from private.problem_solutions) = 0; end \$\$"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check API ownership queries as the RLS-bypassing service role
        working-directory: backend
        env:
          PRACTICELOOP_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/postgres
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m app.engine.catalogue
          python -m pytest -m db
      - name: End-to-end API flow over HTTP (#13)
        working-directory: backend
        env:
          PRACTICELOOP_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/postgres
        run: python ../scripts/e2e_local.py

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip_audit --no-deps --disable-pip --timeout 10 --progress-spinner off -r backend/requirements.txt
      - run: python scripts/check_repository.py
      - name: Scan full Git history with Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts="--all"
