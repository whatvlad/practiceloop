name: Preview
# Preview hosting on Cloudflare Pages: the frontend (mock data) at / and the
# Graphify code graph at /graph/, rebuilt from each push to main.
# Visitors are limited by a Cloudflare Access policy set in the Cloudflare dashboard.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID; without them the build still runs and the deploy is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

env:
  CLOUDFLARE_PROJECT: practiceloop

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Same Graphify release as scripts/setup-graphify.sh (v0.9.92), pinned to its commit.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "graphifyy @ git+https://github.com/Graphify-Labs/graphify.git@86c57be8204673c2a1b9849a3292a7dd3ab373d8"
      - name: Build code graph
        run: |
          graphify update .
          mkdir -p frontend/dist/graph
          cp graphify-out/graph.html frontend/dist/graph/index.html
      # Keep every preview host out of search engines. Cloudflare Pages serves
      # index.html for unknown paths when there is no 404.html, so deep links work.
      - name: Mark preview noindex
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > frontend/dist/_headers
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4.147.0 pages project create "$CLOUDFLARE_PROJECT" --production-branch main \
            || echo "Project already exists."
          npx --yes wrangler@4.147.0 pages deploy frontend/dist --project-name "$CLOUDFLARE_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA"
      - name: Report skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets are not set, so the preview was built but not deployed."
