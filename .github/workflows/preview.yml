name: Preview
# Preview hosting on Cloudflare Pages: the frontend (mock data) at / and the
# Graphify code graph at /graph/, rebuilt from each push to main.
# Served at https://practiceloop.pages.dev (noindex, Google login; headers in frontend/public/_headers).
# The app calls the API same-origin at /api; functions/api forwards that to repo variable
# API_BASE_URL (the Oracle backend; empty skips it), so filtering networks only see pages.dev.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID; without them the build still runs and the deploy is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

env:
  CLOUDFLARE_PROJECT: practiceloop

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_ORIGIN: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
      # Resend key for the feedback form (functions/api/feedback.ts); unset keeps the form on its mailbox fallback.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Validate public browser auth settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const key = process.env.SUPABASE_PUBLISHABLE_KEY || '';
          const raw = process.env.SUPABASE_URL || '';
          if (!key.startsWith('sb_publishable_')) throw new Error('Set the public SUPABASE_PUBLISHABLE_KEY; secret/service-role keys are forbidden in browser builds.');
          const url = new URL(raw);
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) throw new Error('SUPABASE_URL must be the HTTPS project origin.');
          JS
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ env.API_ORIGIN != '' && '/api' || '' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Public site token; unset keeps the beacon off.
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          # Public Cookiebot domain group ID; unset keeps the banner off.
          VITE_COOKIEBOT_ID: ${{ vars.COOKIEBOT_ID }}
          # Launch switches (#39, docs/production/LAUNCH_RUNBOOK.md). Unset keeps the noindex preview.
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
      # Same Graphify release as scripts/setup-graphify.sh (v0.9.92), pinned to its commit.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "graphifyy[sql] @ git+https://github.com/Graphify-Labs/graphify.git@86c57be8204673c2a1b9849a3292a7dd3ab373d8"
      - name: Build code graph
        run: |
          graphify update .
          mkdir -p frontend/dist/graph
          cp graphify-out/graph.html frontend/dist/graph/index.html
      # Headers (noindex, CSP, anti-framing) come from frontend/public/_headers.
      # Cloudflare Pages serves index.html for unknown paths when there is no
      # 404.html, so deep links work and the app shows its own 404 page.
      - name: Check robots headers
        env:
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE }}
        run: |
          if [ "$SITE_INDEXABLE" = "true" ]; then
            grep -q '^https://:project.pages.dev/\*$' frontend/dist/_headers
            grep -q 'Strict-Transport-Security' frontend/dist/_headers
            grep -q '^Sitemap: https://' frontend/dist/robots.txt
          else
            grep -A1 -x '/\*' frontend/dist/_headers | grep -q 'X-Robots-Tag: noindex'
          fi
      # A Pages secret applies to deployments made after it is set, so it goes first.
      - name: Give the feedback form its mail key
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.RESEND_API_KEY != ''
        working-directory: frontend
        run: printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.147.0 pages secret put RESEND_API_KEY --project-name "$CLOUDFLARE_PROJECT"
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: frontend
        run: |
          # Gives functions/api its upstream; deploying from frontend/ picks up functions/.
          printf 'name = "%s"\npages_build_output_dir = "dist"\ncompatibility_date = "2026-10-01"\n\n[vars]\nAPI_ORIGIN = "%s"\n' \
            "$CLOUDFLARE_PROJECT" "$API_ORIGIN" > wrangler.toml
          npx --yes wrangler@4.147.0 pages project create "$CLOUDFLARE_PROJECT" --production-branch main \
            || echo "Project already exists."
          npx --yes wrangler@4.147.0 pages deploy dist --project-name "$CLOUDFLARE_PROJECT" \
            --branch main --commit-hash "$GITHUB_SHA"
      - name: Check the API through pages.dev
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.API_ORIGIN != ''
        run: |
          for _ in $(seq 1 20); do
            curl -fsS --max-time 10 "https://$CLOUDFLARE_PROJECT.pages.dev/api/health" && exit 0
            sleep 6
          done
          echo "::error::https://$CLOUDFLARE_PROJECT.pages.dev/api/health did not answer."
          exit 1
      - name: Report skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets are not set, so the preview was built but not deployed."
