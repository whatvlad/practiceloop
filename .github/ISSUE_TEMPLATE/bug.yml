name: Bug report
description: Reproducible product or infrastructure defect
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and environment
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and regression test
      description: Do not paste tokens, user answers or personal data.
  - type: input
    id: owner
    attributes:
      label: Accountable human, agent, dependencies and linked PRs
