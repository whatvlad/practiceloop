title = "MathLoop secret scanning"
[extend]
useDefault = true

[allowlist]
description = "Local dependencies, build output and ephemeral tooling are not source"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.local/'''
]
# The fake Cloudflare Web Analytics token in frontend/src/analytics.test.ts (#38).
regexes = ['''^0123456789abcdef0123456789abcdef$''']
