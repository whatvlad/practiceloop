[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "practiceloop-backend"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sympy>=1.14,<2",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=2.4.0,<3", "pip-audit>=2.9,<3", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.content" = ["en.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Database tests need disposable Postgres (`-m db`); TeX tests need pdflatex (`-m tex`).
addopts = "-ra -m 'not db and not tex'"
markers = [
  "db: needs PRACTICELOOP_TEST_DATABASE_URL (disposable Postgres only)",
  "tex: needs pdflatex and pdftotext (CI job Worksheet TeX)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
# CI runs on Linux; check as Linux everywhere so Windows runs match (#297).
platform = "linux"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "mpmath"]
ignore_missing_imports = true
