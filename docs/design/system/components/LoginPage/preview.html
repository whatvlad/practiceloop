<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>body{margin:0}.pad{padding:var(--space-5)}</style>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head><body>

<div class="pl-page" style="min-height:640px;display:grid;place-items:center;padding:var(--space-7) var(--space-5)">
  <div class="pl-problem" style="width:100%;max-width:440px;align-items:stretch;padding:var(--space-7) var(--space-6);gap:var(--space-6)">
    <div style="text-align:center"><a class="pl-logo" href="#"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke-width="2.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>PracticeLoop</a></div>
    <div style="text-align:center"><h1 class="pl-display-md">Welcome <em>back.</em></h1>
    <p class="pl-muted" style="margin:var(--space-3) 0 0">Sign in to save every problem you generate.</p></div>
    <button class="pl-btn pl-btn--primary pl-btn--lg pl-btn--block"><span class="pl-g-icon" style="display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:20px">G</span> Continue with Google</button>
    <p class="pl-small pl-subtle" style="margin:0;text-align:center">Google is the only sign-in method for now.</p>
  </div>
</div>
<script>
document.querySelectorAll('[data-tex]').forEach(function(el){try{katex.render(el.getAttribute('data-tex'),el,{displayMode:false,throwOnError:false})}catch(e){el.textContent=el.getAttribute('data-tex')}});
</script>

</body></html>
