<!-- @dsCard group="Practice" height=470 subtitle="Correct, Incorrect, Invalid expression, plus a revealed answer." -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>body{margin:0}.pad{padding:var(--space-5)}</style>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head><body>

<div class="pad pl-stack" style="max-width:640px">
  <div class="pl-result pl-result--correct" role="status"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><div><b>Correct</b><span>Your answer is mathematically equivalent to the solution.</span></div></div>
  <div class="pl-result pl-result--incorrect" role="status"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg><div><b>Incorrect</b><span>That is not equivalent to the correct answer. Try again, or reveal it.</span></div></div>
  <div class="pl-result pl-result--invalid" role="status"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>Invalid expression</b><span>We could not read that. Check your brackets and operators.</span></div></div>
  <div class="pl-answer"><div><div class="pl-label" style="margin-bottom:4px">Answer</div><div class="v"><span data-tex="\sin(x^2)+C"></span></div></div></div>
</div>
<script>
document.querySelectorAll('[data-tex]').forEach(function(el){try{katex.render(el.getAttribute('data-tex'),el,{displayMode:false,throwOnError:false})}catch(e){el.textContent=el.getAttribute('data-tex')}});
</script>

</body></html>
