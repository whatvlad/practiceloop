<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>body{margin:0}.pad{padding:var(--space-5)}</style>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head><body>

<div class="pad" style="max-width:760px">
 <section class="pl-problem">
  <div class="pl-problem-head">
    <div class="meta"><span class="pl-tag">Integration — Substitution</span><span class="pl-small pl-muted"><span class="pl-dots" aria-label="Difficulty 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span> &nbsp;3/5</span></div>
    <span class="pl-label">Problem 42</span>
  </div>
  <div class="pl-stack" style="gap:var(--space-3)">
    <p class="pl-lead" style="margin:0">Calculate:</p>
    <div class="pl-expr"><span data-tex="\int 2x\cos(x^2)\,dx"></span></div>
  </div>
  <div class="pl-field"><label class="pl-label" for="pa">Your answer</label>
    <input id="pa" class="pl-input" placeholder="e.g. sin(x^2) + C"></div>
  <button class="pl-btn pl-btn--primary pl-btn--lg pl-btn--block">Check answer</button>
  <div class="pl-actions"><button class="pl-btn pl-btn--secondary">Show answer</button><button class="pl-btn pl-btn--secondary">Show solution</button><span style="flex:1"></span><button class="pl-btn pl-btn--ghost">Generate next problem <svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
 </section>
</div>
<script>
document.querySelectorAll('[data-tex]').forEach(function(el){try{katex.render(el.getAttribute('data-tex'),el,{displayMode:false,throwOnError:false})}catch(e){el.textContent=el.getAttribute('data-tex')}});
</script>

</body></html>
