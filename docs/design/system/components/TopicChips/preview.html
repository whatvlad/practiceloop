<!-- @dsCard group="Inputs" height=170 subtitle="Single-select topic pills. Selected fills white." -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>body{margin:0}.pad{padding:var(--space-5)}</style>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head><body>

<div class="pad pl-stack">
  <div class="pl-label">Topic</div>
  <div class="pl-chips">
    <button class="pl-chip" aria-pressed="false">Basic integrals</button>
    <button class="pl-chip" aria-pressed="true"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Substitution</button>
    <button class="pl-chip" aria-pressed="false">Integration by parts</button>
    <button class="pl-chip" aria-pressed="false">Rational functions</button>
    <button class="pl-chip" aria-pressed="false">Trigonometric integrals</button>
  </div>
</div>
<script>
document.querySelectorAll('[data-tex]').forEach(function(el){try{katex.render(el.getAttribute('data-tex'),el,{displayMode:false,throwOnError:false})}catch(e){el.textContent=el.getAttribute('data-tex')}});
</script>

</body></html>
