<!-- @dsCard group="Inputs" height=230 subtitle="Five levels: Basic to Advanced. Dots echo the level." -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>body{margin:0}.pad{padding:var(--space-5)}</style>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head><body>

<div class="pad pl-stack" style="max-width:760px;gap:var(--space-5)">
  <div class="pl-label">Difficulty</div>
  <div class="pl-seg">
    <button aria-pressed="false"><span class="n">1</span><span class="t">Basic</span></button>
    <button aria-pressed="false"><span class="n">2</span><span class="t">Easy</span></button>
    <button aria-pressed="true"><span class="n">3</span><span class="t">Medium</span></button>
    <button aria-pressed="false"><span class="n">4</span><span class="t">Hard</span></button>
    <button aria-pressed="false"><span class="n">5</span><span class="t">Advanced</span></button>
  </div>
  <div class="pl-row pl-small pl-muted">Compact form in lists: <span class="pl-dots" aria-label="Difficulty 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span> <span>3/5</span></div>
</div>
<script>
document.querySelectorAll('[data-tex]').forEach(function(el){try{katex.render(el.getAttribute('data-tex'),el,{displayMode:false,throwOnError:false})}catch(e){el.textContent=el.getAttribute('data-tex')}});
</script>

</body></html>
